<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkiaSharp MT PWA</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PWA.styles.css" rel="stylesheet" />
    <script>
        window.canvasHelper = {
            draw: function (canvasId, data, width, height) {
                const canvas = document.getElementById(canvasId);
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                if (canvas.width !== width || canvas.height !== height) {
                    canvas.width = width;
                    canvas.height = height;
                }

                const imageData = new ImageData(new Uint8ClampedArray(data), width, height);
                ctx.putImageData(imageData, 0, 0);
            }
        };
    </script>
</head>

<body>
    <div id="app">
        <div
            style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column;">
            <div class="spinner-border text-primary" role="status"></div>
            <div class="mt-3">Starting SkiaSharp Multi-threaded Engine...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
